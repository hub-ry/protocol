server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS so the lookup happens per-request, not at startup.
    resolver 127.0.0.11 valid=30s;

    # Proxy /api/* to the backend, stripping the /api prefix via rewrite.
    # (proxy_pass with a variable doesn't auto-strip the prefix, so rewrite does it explicitly.)
    location /api/ {
        set $backend http://app:8000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend;
    }

    # For any other path, serve index.html so React routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
